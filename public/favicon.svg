<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark square background -->
  <rect width="64" height="64" rx="12" fill="#0F1115"/>
  <!-- Outer landscape rectangle — heavily rounded -->
  <rect x="3" y="20" width="58" height="24" rx="6" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Card: outlined square left-aligned -->
  <rect x="8" y="24" width="14" height="14" rx="2.5" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Growing bars — solid, bottom-aligned at y=40 -->
  <rect x="30" y="34" width="4" height="6"  rx="1.2" fill="white"/>
  <rect x="37" y="30" width="4" height="10" rx="1.2" fill="white"/>
  <rect x="44" y="25" width="4" height="15" rx="1.2" fill="white"/>
</svg>
