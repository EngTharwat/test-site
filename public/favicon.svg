<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="10" fill="#0F1115"/>
  <!-- Logo scaled to fit 64×64 square (height=48, width=72 → centered) -->
  <!-- Scale: 48/80 = 0.6 → x offset = (64-72)/2 = -4 → shift right by 4 -->
  <!-- Outer: 120×80 × 0.6 = 72×48, top-left at (−4, 8) → use transform -->
  <g transform="translate(-4, 8) scale(0.6)">
    <rect x="2.5" y="2.5" width="115" height="75" rx="13" stroke="white" stroke-width="5" fill="none"/>
    <rect x="22.5" y="25" width="30" height="30" rx="5" stroke="white" stroke-width="5" fill="none"/>
    <rect x="62.5" y="50" width="5" height="20" rx="2.5" fill="white"/>
    <rect x="77.5" y="40" width="5" height="30" rx="2.5" fill="white"/>
    <rect x="92.5" y="30" width="5" height="40" rx="2.5" fill="white"/>
  </g>
</svg>
