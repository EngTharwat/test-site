<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark square background -->
  <rect width="64" height="64" rx="12" fill="#0F1115"/>
  <!-- Outer landscape rectangle border -->
  <rect x="3" y="14" width="58" height="36" rx="7" stroke="white" stroke-width="3" fill="none"/>
  <!-- Card: small outlined square (left) -->
  <rect x="10" y="23" width="13" height="13" rx="2.5" stroke="white" stroke-width="3" fill="none"/>
  <!-- Growing bars — bottom-aligned at y=44 -->
  <rect x="31" y="37" width="4" height="7" rx="2" fill="white"/>
  <rect x="38" y="31" width="4" height="13" rx="2" fill="white"/>
  <rect x="45" y="25" width="4" height="19" rx="2" fill="white"/>
</svg>
