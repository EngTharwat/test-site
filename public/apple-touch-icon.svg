<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <!-- PMBoards Apple touch icon — 180×180, dark background -->
  <rect width="180" height="180" rx="32" fill="#0F1115"/>
  <!-- Logo centered: 120×80 → x=30, y=50 -->
  <g transform="translate(30, 50)">
    <rect x="2.5"  y="2.5"  width="115" height="75" rx="13" stroke="white" stroke-width="5" fill="none"/>
    <rect x="22.5" y="22.5" width="35"  height="35" rx="5"  stroke="white" stroke-width="5" fill="none"/>
    <rect x="67.5" y="40"   width="5"   height="20" rx="2.5" fill="white"/>
    <rect x="82.5" y="30"   width="5"   height="30" rx="2.5" fill="white"/>
    <rect x="97.5" y="20"   width="5"   height="40" rx="2.5" fill="white"/>
  </g>
</svg>
